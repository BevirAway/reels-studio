<!doctype html>
<!-- Слайд каруселі 1080x1350. Кольори й шрифти — з «Мій стиль/STYLE.md»; шрифти лежать у fonts/ поруч. -->
<html lang="uk"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Head"; src: url("fonts/InterTight.ttf"); font-weight: 100 900; }
@font-face { font-family: "Hand"; src: url("fonts/Caveat.ttf"); font-weight: 400 700; }
:root { --bg: #779EC9; --fg: #FFFDF6; --muted: rgba(255,253,246,.78); --accent: #D6E46B; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--fg); }
.slide { position: relative; width: 1080px; height: 1350px; padding: 110px 96px; display: flex; flex-direction: column; }
h1 { font-family: "Head"; font-weight: 800; font-size: 104px; line-height: .98; letter-spacing: -0.035em; }
h1 .dash { margin-right: .12em; }
p { font-family: "Head"; font-weight: 500; font-size: 40px; line-height: 1.28; letter-spacing: -0.01em; color: var(--muted);
    margin-top: 48px; max-width: 820px; }
.acc { color: var(--accent); }
.hand { font-family: "Hand"; font-weight: 600; font-size: 54px; color: var(--accent); }
.num { position: absolute; right: 96px; bottom: 80px; font-family: "Head"; font-weight: 600; font-size: 28px; color: var(--muted); }
svg.line { stroke: var(--fg); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body><div class="slide">
  <h1><span class="dash">–</span>заголовок слайда</h1>
  <p>Короткий текст під заголовком. Одна думка, дві-три строки.</p>
  <div class="num">1/7</div>
</div></body></html>
